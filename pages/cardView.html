<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詳細 - Life Log</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="view">


<header class="view-header">
    <h2 id="title"></h2>
    
    <div class="meta-row">
        <p id="date" class="meta"></p>
        <p id="location" class="meta"></p>
    </div>

</header>


<main class="view-container">

    <div id="description" class="view-desc"></div>
    <div id="emotions" class="view-emotion-tags"></div>
    <div id="fileView" class="file-view"></div>

    <!-- 振り返り -->
    <div id="reflection" class="view-section"></div>

    <!-- ガクチカ -->
    <div id="job" class="view-section"></div>

    <!-- 価値観 -->
    <div id="personality" class="view-section"></div>

</main>


<!-- ===================
    編集モーダル
=================== -->
<!-- 編集モーダル -->
<div class="modal" id="editModal">

    <div class="modal-content">

        <button onclick="closeModal()" class="modal-close">×</button>

        <h2 class="modal-title">イベント編集</h2>

        <div class="form-group">
            <label>タイトル</label>
            <input type="text" id="editTitle">
        </div>

        <div class="form-group">
            <label>日付</label>
            <input type="date" id="editDate">
        </div>

        <div class="form-group">
            <label>場所</label>
            <input type="text" id="editLocation">
        </div>

        <div class="form-group">
            <label>説明</label>
            <textarea id="editDescription"></textarea>
        </div>

        <button type="button" id="editToggleMore" class="more-btn">
            more ▼
        </button>

        <div id="editMoreSection" class="more-section" style="display:none;">

            <h3 class="section-title">振り返り</h3>

            <div class="form-group">
                <label>何をしたか（行動）</label>
                <textarea id="editAction"></textarea>
            </div>

            <div class="form-group">
                <label>どう感じたか（感情）</label>
                <textarea id="editFeeling"></textarea>
            </div>

            <div class="form-group">
                <label>なぜそう感じたか</label>
                <textarea id="editReason"></textarea>
            </div>

            <div class="form-group">
                <label>得たもの・学び</label>
                <textarea id="editLearning"></textarea>
            </div>

            <div class="form-group">
                <label>今の自分への影響</label>
                <textarea id="editImpact"></textarea>
            </div>

            <h3 class="section-title">就活（ガクチカ）</h3>

            <div class="form-group">
                <label>課題</label>
                <textarea id="editProblem"></textarea>
            </div>

            <div class="form-group">
                <label>行動・工夫</label>
                <textarea id="editActionDetail"></textarea>
            </div>

            <div class="form-group">
                <label>結果</label>
                <textarea id="editResult"></textarea>
            </div>

            <h3 class="section-title">価値観・性格</h3>

            <div class="form-group">
                <label>自分らしさが出た点</label>
                <textarea id="editStrength"></textarea>
            </div>

            <div class="form-group">
                <label>改善したい点・課題</label>
                <textarea id="editWeakness"></textarea>
            </div>

        </div>

        <!-- 感情タグ -->
        <div class="emotion-form" id="editEmotions">
            <label class="emotion-box"><input type="checkbox" value="成長"><span>成長</span></label>
            <label class="emotion-box"><input type="checkbox" value="挑戦"><span>挑戦</span></label>
            <label class="emotion-box"><input type="checkbox" value="達成感"><span>達成感</span></label>
            <label class="emotion-box"><input type="checkbox" value="楽しい"><span>楽しい</span></label>
            <label class="emotion-box"><input type="checkbox" value="安心"><span>安心</span></label>
            <label class="emotion-box"><input type="checkbox" value="不安"><span>不安</span></label>
            <label class="emotion-box"><input type="checkbox" value="緊張"><span>緊張</span></label>
        </div>

        <!-- ステージ -->
        <label>始まり・終わり</label>
        <select id="editLifeStage">
            <option value="">-----</option>
            <option value="start">🚀 始まり</option>
            <option value="end">🏁 終わり</option>
        </select>

        <!-- カラー -->
        <div id="editColorPickerBox" style="display:none;">
            <label>背景色</label>

            <div class="color-palette" id="editColorPalette">
                <div class="color-dot" data-color="#e3f2fd" style="background:#e3f2fd"></div>
                <div class="color-dot" data-color="#e8f5e9" style="background:#e8f5e9"></div>
                <div class="color-dot" data-color="#fff3e0" style="background:#fff3e0"></div>
                <div class="color-dot" data-color="#fce4ec" style="background:#fce4ec"></div>
                <div class="color-dot" data-color="#ede7f6" style="background:#ede7f6"></div>
                <div class="color-dot" data-color="#f3e5f5" style="background:#f3e5f5"></div>
                <div class="color-dot" data-color="#e0f2f1" style="background:#e0f2f1"></div>
                <div class="color-dot" data-color="#fffde7" style="background:#fffde7"></div>
                <div class="color-dot" data-color="#efebe9" style="background:#efebe9"></div>
            </div>

            <input type="hidden" id="editBgColor">
        </div>

        <div class="modal-footer">
            <button class="save-btn" onclick="saveEdit()">保存</button>
        </div>

    </div>

</div>

<!-- 画像モーダル -->
<div id="imageModal" class="image-modal">
    <span class="image-modal-close" onclick="closeImageModal()">×</span>

    <img id="expandedImage" class="image-modal-content" style="display:none;">
    <iframe id="pdfFrame" class="image-modal-content"
        style="display:none; width:90vw; height:90vh; border:none;"></iframe>
</div>

<!-- FAB -->
<div class="fab-group" id="fabGroup">

    <a class="fab-button edit" onclick="openEditFromView()">✎</a>
    <a class="fab-button delete" onclick="deleteFromView()">🗑</a>
    <a class="fab-button back" onclick="goBack()">←</a>

</div>

<!-- JS -->
<script src="../js/data/dataManager.js"></script>
<script src="../js/utils/utils.js"></script>
<script src="../js/ui/modal.js"></script>
<script src="../js/views/cardView.js"></script>

</body>
</html>
